[project]
name = "gtfs-backend"
version = "0.1.0"
description = "Map API for mobileKKM (ZTP Kraków); the GTFS worker is in worker/ (Rust)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# The API and the modules it shares (gtfs_backend/*.py: settings, feeds.yml, the Redis layout, keys, ...).
dependencies = [
    "msgspec>=0.19",
    "orjson>=3.11",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "redis[hiredis]>=8.1.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gtfs-api = "gtfs_backend.api.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "gtfs-backend[api]",
    "gtfs-realtime-bindings>=3.0.0",  # tests and bench/replay.py read GTFS-RT files
    "httpx>=0.28.1",  # the API tests' client, bench/replay.py's downloads
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.3.1",
    "ruff>=0.17.2",
]
