# Production: Postgres/PostGIS + Redis + the worker (one process running every static/realtime task) + the HTTP API
# (API_WORKERS processes behind one port).
# The worker and the API are separate images (Dockerfile targets) with separate dependencies.
#   POSTGRES_PASSWORD=... docker compose up -d --build
# The API also joins the external `nginx_proxy` network (create it once: docker network create nginx_proxy), so a
# reverse proxy on that network reaches it as http://api:8000.
services:
  postgres:
    image: ${POSTGIS_IMAGE:-postgis/postgis:17-3.5}
    container_name: mkkm-gtfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gtfs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: mkkm-gtfs-redis
    restart: unless-stopped
    # live data only, nothing to persist. ~10-20 MB in use; the cap is a safety net: everything evictable has a TTL
    # (rt:meta keys have none and are never evicted)
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      target: worker
    container_name: mkkm-gtfs-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gtfs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gtfs}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ARCHIVE_DIR: /data/archive
      OSM_STOPS_FILE: /data/osm/stops.json
    command: ["sh", "-c", "alembic upgrade head && exec gtfs-worker run"]
    # the worker process ~170 MB; an import runs in a process of its own (up to ~1 GB for kmk_a, gone when it ends).
    # Over the limit the import process is killed first (the import is retried) or Docker restarts the worker
    mem_limit: 2g
    volumes:
      - ./data:/data
      - ./feeds.yml:/app/feeds.yml:ro
    # the worker touches /tmp/gtfs-worker.alive every 30 s while all realtime tasks keep polling (and exits, so it is
    # restarted, when one is stuck for WATCHDOG_TIMEOUT); unhealthy = no touch for 2 minutes
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/gtfs-worker.alive') > 120)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  api:
    build:
      context: .
      target: api
    container_name: mkkm-gtfs-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gtfs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gtfs}
      REDIS_URL: redis://redis:6379/0
      API_WORKERS: ${API_WORKERS:-4}
    # ~100 MB per API process plus the supervisor (4 processes: ~400 MB)
    mem_limit: 768m
    networks:
      - default
      - nginx_proxy
    volumes:
      - ./feeds.yml:/app/feeds.yml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  nginx_proxy:
    external: true

volumes:
  pgdata:
