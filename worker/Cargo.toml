[package]
name = "gtfs-worker"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "GTFS static + realtime ingestion for mobileKKM: timetables into Postgres, live data into Redis"
publish = false

[[bin]]
name = "gtfs-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1"
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
osmpbf = "0.3"
prost = "0.14"
rand = "0.8"
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "connection-manager", "aio"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 4
lto = "thin"
