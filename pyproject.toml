[project]
name = "gtfs-backend"
version = "0.1.0"
description = "GTFS static + realtime ingestion and map API for mobileKKM (ZTP Kraków)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Shared by the worker and the API (the modules at the gtfs_backend root).
dependencies = [
    "orjson>=3.10",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]
worker = [
    "alembic>=1.20.1",
    "gtfs-kit>=13.0.1",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "osmium>=4.3.2",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
gtfs-worker = "gtfs_backend.worker.cli:main"
gtfs-api = "gtfs_backend.api.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "gtfs-backend[api,worker]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]
